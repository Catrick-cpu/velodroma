# Builds the Tauri desktop app for macOS (Apple Silicon + Intel), Windows and
# Linux, then attaches the artifacts to a GitHub release.
# Trigger: push a tag like `app-v1.0.0` or run manually from the Actions tab.
#
# Note: licensed NYC skyline GLBs are intentionally not in the repo; CI builds
# ship without them (the city world falls back to procedural scenery).

name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm --workspace src/client/web run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: 'Velodroma Desktop v__VERSION__'
          releaseBody: 'Installers for macOS (Apple Silicon / Intel), Windows and Linux. Unzip and run — the browser version stays available at the web deployment.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
